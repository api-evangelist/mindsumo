name: MindSumo
description: 'MindSumo was a crowdsourcing and open-innovation platform that connected companies
  with a community of students and young professionals to solve time-boxed business challenges
  for monetary prizes, generating ideas, market insight, and hiring leads. A GV (Google
  Ventures) portfolio company later acquired by MBO Partners, the platform distributed over
  $1.3M in rewards across 1,300+ challenges in 200+ countries before being permanently shut
  down after 13 years of operation. MindSumo never published a public developer API, SDK, or
  documentation surface; this profile records its identity and the residual public web
  properties (terms, privacy) that remain live.'
